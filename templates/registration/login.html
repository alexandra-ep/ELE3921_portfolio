{% extends 'base.html' %}

{% block title %}Elevate | Log In{% endblock %}

{% block content %}
    <h1>Login</h1>

    {% if form.errors %}
        <p>Your username or password was incorrect. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>

    <p><a href="/">Back to home</a></p>
{% endblock %}
