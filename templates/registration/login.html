<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
    </head>
    <body>
        <h1>Login</h1>

        {% if form.errors %}
            <p>Your username or password was incorrect. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as.p }}
            <button type="submit">Log in</button>
        </form>

        <p><a href="/">Back to home</a></p>
    </body>
</html>
